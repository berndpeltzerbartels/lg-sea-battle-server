<section class="controller-card" aria-labelledby="heading-ZoomControlFrontlet">
 <p class="scope">Sehrohr, Geschützvisier und Fernglas</p><h3 id="heading-ZoomControlFrontlet">Zoom</h3>
 <p>Wechselt die Vergrößerung der aktuellen Sicht, sofern diese einen Zoom besitzt. Die Belegung gilt für Torpedoboot und U-Boot.</p>
 <div class="binding-row" data-controller-action="zoom" data-prompt="Gewünschte Zoomtaste drücken.">
    <div><span class="binding-label">Zoom wechseln</span><output data-binding-value>Nicht belegt</output><span class="keyboard-hint">Ohne Controller: <kbd>Z</kbd> auf der Tastatur.</span><span class="live-input" data-binding-live></span></div>
    <div class="row-buttons"><button type="button" data-bind="zoom" aria-label="Zoom wechseln belegen">Belegen</button><button type="button" class="quiet" data-clear="zoom" aria-label="Zoom wechseln löschen">Löschen</button></div>
</div>
</section>
