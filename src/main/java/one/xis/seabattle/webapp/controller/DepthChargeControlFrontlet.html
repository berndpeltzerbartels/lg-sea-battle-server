<section class="controller-card" aria-labelledby="heading-DepthChargeControlFrontlet">
 <p class="scope">Nur Torpedoboot</p><h3 id="heading-DepthChargeControlFrontlet">Wasserbomben</h3>
 <p>Wirft Wasserbomben, wenn die aktuelle Position dies erlaubt und die Werfer bereit sind. Beim U-Boot wird diese Taste nicht verwendet. Du kannst sie trotzdem schon jetzt einrichten.</p>
 <div class="binding-row" data-controller-action="depth-charge" data-prompt="Gewünschte Taste für Wasserbomben drücken.">
    <div><span class="binding-label">Wasserbomben werfen</span><output data-binding-value>Nicht belegt</output><span class="keyboard-hint">Ohne Controller: <kbd>W</kbd> auf der Tastatur.</span><span class="live-input" data-binding-live></span></div>
    <div class="row-buttons"><button type="button" data-bind="depth-charge" aria-label="Wasserbomben werfen belegen">Belegen</button><button type="button" class="quiet" data-clear="depth-charge" aria-label="Wasserbomben werfen löschen">Löschen</button></div>
</div>
</section>
