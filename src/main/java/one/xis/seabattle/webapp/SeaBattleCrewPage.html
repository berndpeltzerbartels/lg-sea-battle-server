<!DOCTYPE html>
<html xmlns:xis="https://xis.one/xsd" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Battle - Anheuern</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #092433; color: #f7fbff; }
        * { box-sizing: border-box; }
        main { max-width: 900px; margin: 40px auto; padding: 20px; }
        h1 { font-size: 28px; } h2 { font-size: 20px; margin-top: 32px; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #42606b; overflow-wrap: anywhere; }
        form { display: grid; gap: 12px; margin-top: 24px; }
        button, select { min-height: 44px; padding: 10px; font: inherit; max-width: 100%; }
        a { color: #a8eeed; } .message { color: #ffb39f; }
        .decision { border-left: 3px solid #9edac6; padding: 12px 16px; background: #18353c; }
        .request-Abgelehnt, .request-Abgelaufen { color: #ffb39f; }
        .request-Angenommen { color: #bce2cb; }
    </style>
</head>
<body><main>
    <a xis:page="/start.html">Zur Anmeldung<xis:parameter name="mode" value="crew"/></a>
    <h1>Anheuern</h1>
    <a id="boarding" href="app?vehicle=torpedo-boat" xis:if="ready">An Bord</a>
    <p class="decision" role="status" xis:if="!empty(decisionNotice)">${decisionNotice}</p>
    <p xis:if="empty(ships)">Keine bemannten Torpedoboote verf&uuml;gbar.</p>
    <table xis:if="!empty(ships)">
        <thead><tr><th>Schiff</th><th>Flotte</th><th>Besatzung</th><th>Status</th></tr></thead>
        <tbody>
            <tr xis:repeat="ship:ships"><td>${ship.id}</td><td>${ship.team}</td><td>${ship.crew}</td><td>${ship.status}</td></tr>
        </tbody>
    </table>
    <form xis:binding="crew" xis:if="!empty(availableShips)">
        <xis:global-messages/>
        <label for="shipId">Schiff</label>
        <select id="shipId" xis:binding="shipId">
            <option value="">Schiff ausw&auml;hlen</option>
            <option xis:repeat="ship:availableShips" value="${ship.id}">${ship.id} - ${ship.team} - ${ship.crew}</option>
        </select>
        <div class="message" xis:message-for="shipId"></div>
        <button type="submit" xis:action="request">Anfragen</button>
    </form>
    <h2 xis:if="!empty(requests)">Meine Anfragen</h2>
    <ul><li xis:repeat="request:requests" class="request-${request.status}">${request.shipId}: ${request.status}</li></ul>
</main>
</body>
</html>
