<!DOCTYPE html>
<html xmlns:xis="https://xis.one/xsd" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Besatzungsanfrage</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: transparent; color: #f2f7f5; }
        * { box-sizing: border-box; letter-spacing: 0; }
        body { margin: 0; background: transparent; }
        .crew-request { padding: 16px; border: 1px solid #638080; border-left: 3px solid #9edac6;
            border-radius: 6px; background: #102a30; width: 100%; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .label { font-size: 11px; color: #a1d6c8; font-weight: 700; text-transform: uppercase; }
        .ship { font-size: 11px; color: #bdc9ce; }
        .person { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
        .alias { border: 1px solid #66857c; background: #28443c; border-radius: 4px; padding: 8px;
            font-weight: 700; font-size: 12px; max-width: 85px; overflow-wrap: anywhere; }
        strong { display: block; font-size: 15px; overflow-wrap: anywhere; }
        p { margin: 3px 0 0; font-size: 12px; color: #c0cdd0; }
        .actions { display: flex; gap: 8px; }
        button { min-height: 36px; padding: 7px 12px; font: 600 12px system-ui; border-radius: 4px;
            border: 1px solid #698079; background: transparent; color: #d8e2e0; cursor: pointer; }
        button.accept { flex: 1; background: #bce2cb; border-color: #bce2cb; color: #123027; }
        button:hover { filter: brightness(1.12); } button:focus-visible { outline: 2px solid white; outline-offset: 2px; }
    </style>
</head>
<body>
    <section class="crew-request" xis:repeat="request:inbox" aria-label="Besatzungsanfrage">
        <header><span class="label">Besatzungsanfrage</span><span class="ship">${request.shipId}</span></header>
        <div class="person"><span class="alias">${request.alias}</span>
            <div><strong>${request.nickname}</strong><p>m&ouml;chte an Bord kommen.</p></div>
        </div>
        <form xis:binding="decision">
            <input type="hidden" xis:binding="requestId">
            <div class="actions">
                <button type="button" class="accept" xis:action="accept"><xis:parameter name="requestId" value="${request.id}"/>Annehmen</button>
                <button type="button" xis:action="decline"><xis:parameter name="requestId" value="${request.id}"/>Ablehnen</button>
            </div>
            <p xis:message-for="requestId"></p>
        </form>
    </section>
</body>
</html>
