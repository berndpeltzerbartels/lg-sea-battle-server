<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Küstenkrieg</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f7fbff; background: #092433; }
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(180deg, #5e89a6 0 42%, #0b2936 42% 100%); }
    main { min-height: 100vh; width: min(960px, calc(100% - 44px)); margin: auto; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 24px; padding: 48px 0; }
    h1 { font-size: 64px; line-height: 1.1; margin: 0; letter-spacing: 0; overflow-wrap: anywhere; }
    p { max-width: 52ch; font-size: 17px; line-height: 1.5; margin: 0; color: #d8e9ef; }
    .scene { width: 100%; height: 150px; position: relative; overflow: hidden; border-bottom: 2px solid #a3e2e888; }
    .scene::before { content: ""; position: absolute; inset: 0; background: #587a58; opacity: .72; clip-path: polygon(0 100%, 12% 62%, 18% 70%, 32% 30%, 46% 74%, 60% 48%, 78% 68%, 100% 36%, 100% 100%); }
    a { display: inline-flex; align-items: center; min-height: 50px; padding: 12px 18px; border-radius: 7px; background: #d9f4f5; color: #082330; font-size: 16px; font-weight: 800; text-decoration: none; }
    a:hover, a:focus-visible { background: white; outline: 2px solid #a8eeed; outline-offset: 4px; }
    @media (max-width: 600px) { h1 { font-size: 38px; } .scene { height: 100px; } }
  </style>
</head>
<body>
  <main>
    <h1>Küstenkrieg</h1>
    <div class="scene" aria-hidden="true"></div>
    <p>Unser Flottenspiel ist umgezogen. Gespielt wird jetzt auf kuestenkrieg.de.</p>
    <a href="http://kuestenkrieg.de/start.html">Küstenkrieg starten</a>
  </main>
</body>
</html>
