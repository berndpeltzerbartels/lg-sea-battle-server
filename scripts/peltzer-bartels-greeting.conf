<VirtualHost *:80>
    ServerName peltzer-bartels.de
    ServerAlias www.peltzer-bartels.de mail.peltzer-bartels.de
    DocumentRoot /var/www/html
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/peltzer-bartels-error.log
    CustomLog ${APACHE_LOG_DIR}/peltzer-bartels-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName peltzer-bartels.de
    ServerAlias www.peltzer-bartels.de mail.peltzer-bartels.de
    DocumentRoot /var/www/html
    DirectoryIndex kuestenkrieg.html
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/peltzer-bartels.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/peltzer-bartels.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    <Directory /var/www/html>
        Require all granted
        Options -Indexes
        DirectoryIndex kuestenkrieg.html
    </Directory>
    RewriteEngine On
    # Existing game bookmarks show the same static greeting, never the retired backend.
    RewriteRule ^/(?:sea-battle(?:/.*)?|app|start\.html|portal\.html|index\.html|home\.html)$ /kuestenkrieg.html [END]
    RewriteRule ^/game(?:/.*)?$ - [G,L]
    ErrorLog ${APACHE_LOG_DIR}/peltzer-bartels-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/peltzer-bartels-ssl-access.log combined
</VirtualHost>
